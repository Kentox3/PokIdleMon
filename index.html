<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IdleV2 — Kanto Side-Scroller</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ═══ LADE-SCREEN ══════════════════════════════════════════ -->
<div id="loadScreen">
  <div class="load-box">
    <div class="load-pokeball">⚪</div>
    <h2>IdleV2</h2>
    <p id="loadStatus">Verbinde mit Firebase...</p>
  </div>
</div>

<!-- ═══ AUTH-SCREEN ══════════════════════════════════════════ -->
<div id="authScreen" hidden>
  <div class="auth-box">
    <h2>🎮 IdleV2</h2>
    <p style="color:#aaa;margin-bottom:20px">Kanto Side-Scroller RPG</p>
    <div class="auth-tabs">
      <button id="tabLogin"    class="auth-tab active" onclick="showAuthTab('login')">Anmelden</button>
      <button id="tabRegister" class="auth-tab"        onclick="showAuthTab('register')">Registrieren</button>
    </div>
    <!-- Login -->
    <div id="loginForm">
      <input id="loginEmail"    type="email"    placeholder="E-Mail" autocomplete="email">
      <input id="loginPassword" type="password" placeholder="Passwort" autocomplete="current-password">
      <button class="btn-primary" onclick="doLogin()">Anmelden</button>
    </div>
    <!-- Register -->
    <div id="registerForm" hidden>
      <input id="regName"     type="text"     placeholder="Trainer-Name (2–20 Zeichen)">
      <input id="regEmail"    type="email"    placeholder="E-Mail" autocomplete="email">
      <input id="regPassword" type="password" placeholder="Passwort (min. 6 Zeichen)" autocomplete="new-password">
      <button class="btn-primary" onclick="doRegister()">Registrieren</button>
    </div>
    <p id="authMsg" class="auth-msg"></p>
  </div>
</div>

<!-- ═══ STARTER-SCREEN ════════════════════════════════════════ -->
<div id="starterScreen" hidden>
  <div class="starter-box">
    <h2>🌟 Wähle deinen Starter!</h2>
    <input id="trainerName" type="text" placeholder="Dein Trainer-Name" maxlength="20" value="Trainer">
    <div id="starterGrid"></div>
    <p style="color:#aaa;font-size:13px;margin-top:12px">Klicke auf ein Pokémon, um dein Abenteuer zu beginnen</p>
  </div>
</div>

<!-- ═══ SPIEL-SCREEN ══════════════════════════════════════════ -->
<div id="gameScreen" hidden>

  <!-- HUD -->
  <div id="hud">
    <span id="hudPlayer">Trainer</span>
    <span id="hudMoney">0 ₽</span>
    <span id="hudBadges">0/8 🏅</span>
    <button class="btn-logout" onclick="doLogout()">Abmelden</button>
  </div>

  <!-- Zonen-Info -->
  <div id="zoneInfoBar">
    <span id="zoneName">Route 1</span>
    <span id="stageInfo">Etappe 1 / 10</span>
    <div id="stageProgressBar"><div id="stageProgressFill"></div></div>
  </div>

  <!-- Side-Scroller Szene -->
  <div id="sceneView">
    <!-- Parallax-Hintergrund -->
    <div class="bg-layer bg-sky"></div>
    <div class="bg-layer bg-mid"></div>
    <!-- Ground -->
    <div id="sceneGround"></div>
    <!-- Spieler-Sprites (links, laufen rechts) -->
    <div id="playerSprites"></div>
    <!-- Gegner-Sprite (rechts, erscheint beim Kampf) -->
    <div id="enemySprite"></div>
    <!-- Schadenzahlen -->
    <!-- XP-Popup -->
    <div id="xpPopup"></div>
    <!-- Toast -->
    <div id="toastZone"></div>
  </div>

  <!-- Kampf-Panel -->
  <div id="battlePanel">
    <div id="battleLog"></div>
    <div id="battleActions">
      <div id="moveButtons"></div>
      <div id="battleBtns">
        <button id="catchBtn" class="btn-catch" onclick="onCatchClick('pokeball')" style="display:none">🎯 Fangen</button>
        <button id="autoFightBtn" class="btn-auto" onclick="toggleAutoFight()">⚡ Auto</button>
        <button id="fleeBtn" class="btn-flee" onclick="onFleeClick()">🏃 Fliehen</button>
      </div>
    </div>
  </div>

  <!-- Tab-Navigation -->
  <nav id="tabs">
    <button id="tabWorld" class="tab active" onclick="onTabWorld()">🌍 Route</button>
    <button id="tabTeam"  class="tab"        onclick="onTabTeam()">👥 Team</button>
    <button id="tabBag"   class="tab"        onclick="onTabBag()">🎒 Tasche</button>
    <button id="tabMap"   class="tab"        onclick="onTabMap()">🗺️ Karte</button>
  </nav>

  <!-- Tab-Views -->
  <div id="viewWorld" class="tab-view"></div>

  <div id="viewTeam" class="tab-view" hidden>
    <h3>Party</h3>
    <div id="teamList"></div>
    <h3 style="margin-top:16px">Box</h3>
    <div id="boxPreview" class="box-grid"></div>
  </div>

  <div id="viewBag" class="tab-view" hidden>
    <h3>Tasche</h3>
    <div id="bagList"></div>
  </div>

  <div id="viewMap" class="tab-view" hidden>
    <h3>Kanto-Karte</h3>
    <div id="badgeRow" class="badge-row"></div>
    <div id="mapList"></div>
  </div>

</div>

<!-- ═══ POPUPS ════════════════════════════════════════════════ -->
<!-- Shop -->
<div id="shopPopup" class="popup-overlay" hidden>
  <div class="popup-box">
    <div class="popup-header">
      <h3>🏪 Shop</h3>
      <button onclick="closeShop()">✕</button>
    </div>
    <div id="shopItemList"></div>
  </div>
</div>

<!-- Gym -->
<div id="gymPopup" class="popup-overlay" hidden>
  <div class="popup-box">
    <div class="popup-header">
      <h3>⚔️ Arenakampf</h3>
      <button onclick="closeGymPopup()">✕</button>
    </div>
    <div id="gymContent"></div>
  </div>
</div>

<!-- Offline-Belohnung -->
<div id="offlineModal" class="popup-overlay" hidden>
  <div class="popup-box">
    <h3>⏰ Willkommen zurück!</h3>
    <p id="offlineMsg"></p>
    <button class="btn-primary" onclick="closeOfflineModal()">OK</button>
  </div>
</div>

<!-- ═══ SCRIPTS ═══════════════════════════════════════════════ -->
<!-- Firebase compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<!-- Daten -->
<script src="js/pkmn.js"></script>
<script src="js/moves.js"></script>
<script src="js/world.js"></script>
<!-- Logik -->
<script src="js/engine.js"></script>
<script src="js/battle.js"></script>
<script src="js/renderer.js"></script>
<script src="js/ui.js"></script>
<!-- Auth + DB zuletzt (db.js feuert firebaseReady) -->
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/db.js"></script>

</body>
</html>
