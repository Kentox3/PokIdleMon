<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PokIdleMon</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/hub.css">
</head>
<body>

<!-- ═══════════════ LADE-SCREEN ═══════════════ -->
<div id="loadScreen">
  <div class="load-box">
    <span class="load-pokeball">⚪</span>
    <h2>PokIdleMon</h2>
    <p id="loadStatus">Lade Daten...</p>
  </div>
</div>

<!-- ═══════════════ AUTH-SCREEN ═══════════════ -->
<div id="authScreen" style="display:none">
  <div class="auth-wrap">
    <div class="auth-logo">
      <span class="auth-logo-ball">⚪</span>
      <h1>PokIdleMon</h1>
      <p>Gen 1 · Idle RPG</p>
    </div>

    <div class="auth-card" id="loginCard">
      <h2>Anmelden</h2>
      <label class="field-label">Trainer-Name</label>
      <input type="text" id="loginUsername" placeholder="Dein Name" autocomplete="username" maxlength="16">
      <label class="field-label">PIN <span class="field-hint">(6 Ziffern)</span></label>
      <input type="password" id="loginPin" placeholder="••••••" inputmode="numeric" oninput="pinOnly(this)" autocomplete="current-password">
      <div class="auth-msg" id="loginMsg"></div>
      <button class="btn-primary" onclick="doLogin()">Spielen ▶</button>
      <div class="auth-divider"></div>
      <div class="auth-switch-text">Noch kein Konto?</div>
      <button class="btn-secondary" onclick="switchToRegister()">Jetzt registrieren</button>
    </div>

    <div class="auth-card" id="registerCard" style="display:none">
      <h2>Registrieren</h2>
      <label class="field-label">Trainer-Name <span class="field-hint">(3–16 Zeichen)</span></label>
      <input type="text" id="regUsername" placeholder="Dein Name" autocomplete="username" maxlength="16">
      <label class="field-label">PIN <span class="field-hint">(6 Ziffern)</span></label>
      <input type="password" id="regPin" placeholder="••••••" inputmode="numeric" oninput="pinOnly(this)" autocomplete="new-password">
      <label class="field-label">PIN wiederholen</label>
      <input type="password" id="regPin2" placeholder="••••••" inputmode="numeric" oninput="pinOnly(this)" autocomplete="new-password">
      <div class="auth-msg" id="registerMsg"></div>
      <button class="btn-primary" onclick="doRegister()">Konto erstellen</button>
      <div class="auth-divider"></div>
      <button class="btn-secondary" onclick="switchToLogin()">← Zurück zum Login</button>
    </div>
  </div>
</div>

<!-- ═══════════════ STARTER-SCREEN ═══════════════ -->
<div id="starterScreen" style="display:none">
  <div class="starter-box">
    <h2>Wähle deinen Starter!</h2>
    <input type="text" id="trainerName" placeholder="Dein Trainer-Name" maxlength="16">
    <div id="starterNameMsg" style="color:#ef4444;font-size:12px;margin:-20px 0 16px;min-height:16px;text-align:center"></div>
    <div id="starterGrid"></div>
  </div>
</div>

<!-- ═══════════════ SPIEL-SCREEN ═══════════════ -->
<div id="gameScreen" style="display:none">

  <!-- HUD -->
  <div id="hud">
    <span id="hudSpieler">Trainer</span>
    <span id="hudGeld">0 ₽</span>
    <span id="hudOrden">0/8 🏅</span>
    <button class="btn-logout" onclick="doLogout()">⎋</button>
  </div>

  <!-- Zone-Info -->
  <div id="zoneInfoBar">
    <span id="zoneName">Lade...</span>
    <span id="stageInfo"></span>
    <div id="stageProgressBar"><div id="stageProgressFill" style="width:0%"></div></div>
    <button class="btn-auto" id="autoKampfBtn" onclick="toggleAutoKampf()">⚡ Auto</button>
  </div>

  <!-- Szene -->
  <div id="sceneView">
    <div id="playerSprites"></div>
    <div id="enemySprite" style="opacity:0"></div>
    <div id="xpPopup"></div>
    <div id="toastZone"></div>
  </div>

  <!-- Kampf-Panel -->
  <div id="battlePanel">
    <div id="battleLog"></div>
    <div id="battleActions">
      <div id="moveButtons"></div>
      <div id="battleBtns">
        <div id="catchBalls"></div>
        <button class="btn-flee" onclick="onFluchtKlick()">🏃 Flucht</button>
      </div>
    </div>
  </div>

  <!-- Tab-Navigation -->
  <nav id="tabs">
    <button class="tab active" id="tabWelt"   onclick="onTabWelt()">🌿 Welt</button>
    <button class="tab"        id="tabAngeln" onclick="onTabAngeln()">🎣 Angeln</button>
    <button class="tab"        id="tabTeam"   onclick="onTabTeam()">👥 Team</button>
    <button class="tab"        id="tabTasche" onclick="onTabTasche()">🎒 Tasche</button>
    <button class="tab"        id="tabKarte"  onclick="onTabKarte()">🗺️ Karte</button>
    <button class="tab"        id="tabDex"    onclick="onTabDex()">📖 Dex</button>
  </nav>

  <!-- Tab-Views -->
  <div id="viewWorld"  class="tab-view"></div>

  <div id="viewFishing" class="tab-view" style="display:none">
    <div id="fishingContent"></div>
  </div>

  <div id="viewTeam"   class="tab-view" style="display:none">
    <div id="teamList"></div>
    <h3 style="margin-top:14px;font-family:var(--font-title);font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:1px;padding-bottom:6px;border-bottom:1px solid var(--border)">📦 Box</h3>
    <div id="boxPreview" class="box-grid"></div>
  </div>

  <div id="viewBag"    class="tab-view" style="display:none">
    <div id="bagList"></div>
  </div>

  <div id="viewMap"    class="tab-view" style="display:none">
    <div class="badge-row" id="badgeRow"></div>
    <div id="mapList"></div>
  </div>

  <div id="viewDex"    class="tab-view" style="display:none">
    <div id="dexContent">
      <p style="color:var(--text-3);text-align:center;padding:20px">Pokédex — coming soon</p>
    </div>
  </div>

</div><!-- /#gameScreen -->

<!-- ═══════════════ POPUPS ═══════════════ -->
<!-- Shop -->
<div id="shopPopup" class="popup-overlay" style="display:none">
  <div class="popup-box">
    <div class="popup-header">
      <h3>🛒 Supermarkt</h3>
      <button onclick="schliesseShop()">✕</button>
    </div>
    <div id="shopItemList"></div>
  </div>
</div>

<!-- Offline-Bonus -->
<div id="offlineModal">
  <div class="offline-box">
    <h3>⏰ Willkommen zurück!</h3>
    <div id="offlineMsg"></div>
    <button class="btn-primary" onclick="schliesseOfflineModal()">Weiterspielen ▶</button>
  </div>
</div>

<!-- ═══════════════ SCRIPTS ═══════════════ -->
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Daten & Engine -->
<script src="js/db.js"></script>
<script src="js/loader.js"></script>
<script src="js/engine.js"></script>
<script src="js/battle.js"></script>

<!-- UI & Rendering -->
<script src="js/renderer.js"></script>
<script src="js/ui.js"></script>

<!-- Auth & App-Controller -->
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

</body>
</html>
