<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokIdleMon</title>
  <link rel="stylesheet" href="css/main.css">
  <style>[hidden]{display:none!important}</style>
</head>
<body>

<!-- ═══ LADE-SCREEN ══════════════════════════════════════════ -->
<div id="loadScreen" style="display:flex">
  <div class="load-box">
    <div class="load-pokeball">⚪</div>
    <h2>PokIdleMon</h2>
    <p id="loadStatus">Verbinde...</p>
  </div>
</div>

<!-- ═══ AUTH-SCREEN ══════════════════════════════════════════ -->
<div id="authScreen" style="display:none">
  <div class="auth-wrap">
    <div class="auth-logo">
      <span class="auth-logo-ball">⚪</span>
      <h1>PokIdleMon</h1>
      <p>Kanto Side-Scroller RPG</p>
    </div>
    <div id="loginCard" class="auth-card">
      <h2>Anmelden</h2>
      <label class="field-label">Nutzername</label>
      <input id="loginUsername" type="text" placeholder="Dein Nutzername" maxlength="16" autocomplete="username" autocapitalize="off" autocorrect="off">
      <label class="field-label">PIN <span class="field-hint">(6 Ziffern)</span></label>
      <input id="loginPin" type="password" placeholder="••••••" maxlength="6" inputmode="numeric" oninput="pinOnly(this)" autocomplete="current-password">
      <button class="btn-primary" onclick="doLogin()">🎮 Anmelden</button>
      <p id="loginMsg" class="auth-msg"></p>
      <div class="auth-divider"></div>
      <p class="auth-switch-text">Noch kein Konto?</p>
      <button class="btn-secondary" onclick="switchToRegister()">✨ Jetzt registrieren</button>
    </div>
    <div id="registerCard" class="auth-card" style="display:none">
      <h2>Konto erstellen</h2>
      <label class="field-label">Nutzername <span class="field-hint">(3–16 Zeichen)</span></label>
      <input id="regUsername" type="text" placeholder="z. B. AshKetchum" maxlength="16" autocapitalize="off" autocorrect="off">
      <label class="field-label">PIN wählen <span class="field-hint">(genau 6 Ziffern)</span></label>
      <input id="regPin"  type="password" placeholder="••••••" maxlength="6" inputmode="numeric" oninput="pinOnly(this)">
      <label class="field-label">PIN wiederholen</label>
      <input id="regPin2" type="password" placeholder="••••••" maxlength="6" inputmode="numeric" oninput="pinOnly(this)">
      <button class="btn-primary" onclick="doRegister()">✨ Konto erstellen</button>
      <p id="registerMsg" class="auth-msg"></p>
      <div class="auth-divider"></div>
      <button class="btn-secondary" onclick="switchToLogin()">← Zurück zum Login</button>
    </div>
  </div>
</div>

<!-- ═══ STARTER-SCREEN ════════════════════════════════════════ -->
<div id="starterScreen" style="display:none">
  <div class="starter-box">
    <h2>🌟 Wähle deinen Starter!</h2>
    <input id="trainerName" type="text" placeholder="Trainer-Name" maxlength="20" value="Trainer">
    <div id="starterGrid"></div>
    <p style="color:#aaa;font-size:13px;margin-top:12px">Klicke auf ein Pokémon</p>
  </div>
</div>

<!-- ═══ SPIEL-SCREEN ══════════════════════════════════════════ -->
<div id="gameScreen" style="display:none">
  <div id="hud">
    <span id="hudPlayer">Trainer</span>
    <span id="hudMoney">0 ₽</span>
    <span id="hudBadges">0/8 🏅</span>
    <button class="btn-logout" onclick="doLogout()">Abmelden</button>
  </div>
  <div id="zoneInfoBar">
    <span id="zoneName">Route 1</span>
    <span id="stageInfo">Etappe 1 / 10</span>
    <div id="stageProgressBar"><div id="stageProgressFill"></div></div>
  </div>
  <div id="sceneView">
    <!-- Canvas wird von renderer.js dynamisch eingefügt -->
    <div id="playerSprites"></div>
    <div id="enemySprite"></div>
    <div id="xpPopup"></div>
    <div id="toastZone"></div>
  </div>
  <div id="battlePanel">
    <div id="battleLog"></div>
    <div id="battleActions">
      <div id="moveButtons"></div>
      <div id="battleBtns">
        <button id="catchBtn"     class="btn-catch" onclick="onCatchClick('pokeball')" style="display:none">🎯 Fangen</button>
        <button id="autoFightBtn" class="btn-auto"  onclick="toggleAutoFight()">⚡ Auto</button>
        <button id="fleeBtn"      class="btn-flee"  onclick="onFleeClick()">🏃 Fliehen</button>
      </div>
    </div>
  </div>
  <nav id="tabs">
    <button id="tabWorld" class="tab active" onclick="onTabWorld()">🌍 Route</button>
    <button id="tabTeam"  class="tab"        onclick="onTabTeam()">👥 Team</button>
    <button id="tabBag"   class="tab"        onclick="onTabBag()">🎒 Tasche</button>
    <button id="tabMap"   class="tab"        onclick="onTabMap()">🗺️ Karte</button>
  </nav>
  <div id="viewWorld" class="tab-view" style="display:block"></div>
  <div id="viewTeam"  class="tab-view" style="display:none">
    <h3>Party</h3><div id="teamList"></div>
    <h3 style="margin-top:16px">Box</h3><div id="boxPreview" class="box-grid"></div>
  </div>
  <div id="viewBag"  class="tab-view" style="display:none"><h3>Tasche</h3><div id="bagList"></div></div>
  <div id="viewMap"  class="tab-view" style="display:none">
    <h3>Kanto-Karte</h3><div id="badgeRow" class="badge-row"></div><div id="mapList"></div>
  </div>
</div>

<!-- ═══ OHNMACHT-BLACKOUT ════════════════════════════════════ -->
<div id="blackoutOverlay" style="
  display:none; position:fixed; inset:0; z-index:9999;
  align-items:center; justify-content:center; flex-direction:column;
  background:#000; opacity:0;
  transition:opacity 0.3s ease, background 0.3s ease;
  pointer-events:all;">
  <div class="bo-text" style="
    color:#fff; font-size:20px; font-weight:700; text-align:center;
    font-family:'Segoe UI',sans-serif; letter-spacing:1px;
    text-shadow:0 0 20px rgba(255,255,255,0.5);"></div>
</div>

<!-- ═══ POPUPS ════════════════════════════════════════════════ -->
<div id="shopPopup"    class="popup-overlay" style="display:none"><div class="popup-box"><div class="popup-header"><h3>🏪 Shop</h3><button onclick="closeShop()">✕</button></div><div id="shopItemList"></div></div></div>
<div id="gymPopup"     class="popup-overlay" style="display:none"><div class="popup-box"><div class="popup-header"><h3>⚔️ Arena</h3><button onclick="closeGymPopup()">✕</button></div><div id="gymContent"></div></div></div>
<div id="offlineModal" class="popup-overlay" style="display:none"><div class="popup-box"><h3>⏰ Willkommen zurück!</h3><p id="offlineMsg"></p><button class="btn-primary" onclick="closeOfflineModal()">OK</button></div></div>

<!-- ═══ SCRIPTS ═══════════════════════════════════════════════ -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/pkmn.js"></script>
<script src="js/moves.js"></script>
<script src="js/world.js"></script>
<script src="js/engine.js"></script>
<script src="js/battle.js"></script>
<script src="js/renderer.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/db.js"></script>
</body>
</html>
